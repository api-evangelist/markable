name: Markable
description: 'Markable (markable.ai) is an all-in-one monetization platform for affiliate
  creators and social-commerce influencers. It turns social posts into revenue with
  smart affiliate deeplinks across Amazon, Target, and Walmart, a shop-in-bio storefront,
  storefront sync for product collections, Instagram auto-DM replies, AI-generated
  collages and captions, viral-product discovery, and performance analytics. It is
  offered as an iOS app and a desktop web app, with a creator performance/boosting
  program. Markable is backed by Partech. Markable also published an earlier developer
  product, the Markable Lens API — a visual search platform for finding products and
  styles inside images and video against indexed catalogs — whose reference is still
  publicly served at docs-dev.markable.ai. Access to that API is gated on manual
  developer verification, no machine-readable contract (OpenAPI/AsyncAPI/GraphQL/MCP)
  is published, and the API hosts it documents were not reachable when last probed.'
