apis:
- name: Markable Lens API
  description: 'Markable''s visual search platform API. Index catalogs of products or
    styles, then search for visually similar items inside images and video. Covers
    catalog and catalog-item management, product search, "how to wear it" style search,
    video search, and a category/attribute taxonomy. Authentication is a two-stage
    bearer-token exchange (user access token, then client access token). Access requires
    manual developer verification by Markable; no OpenAPI is published. The reference
    is live and public, but the documented runtime hosts were unreachable when probed
    on 2026-08-13 — see lifecycle/markable-lifecycle.yml.'
